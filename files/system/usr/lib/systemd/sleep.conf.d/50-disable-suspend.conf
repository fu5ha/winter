# Never suspend or hibernate. This board hangs on resume from S3
# (deep) sleep, and the machine should stay reachable on the network
# while idle. "Sleep" here means S0 with displays off and the screen
# locked, which KDE handles in the user session. These switches make
# systemd refuse every suspend/hibernate operation and stop
# advertising them to logind clients.

[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
